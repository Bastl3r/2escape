<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - 2Escape</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 1rem;
    }
    h1 { margin-bottom: 0.5rem; color: #0066cc; }
    p { max-width: 400px; line-height: 1.5; color: #666; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background-color: #0052a3; }
  </style>
</head>
<body>
  <h1>You are currently offline</h1>
  <p>Please check your internet connection to access this page.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
