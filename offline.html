<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d0f12">
    <title>Offline // 2Escape</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background-color: #0d0f12;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #d1d5db;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            text-align: center;
        }

        .panel {
            width: 100%;
            max-width: 26rem;
            background: #12161f;
            border: 1px solid rgba(0, 240, 255, 0.27);
            border-radius: 0.5rem;
            padding: 2rem 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        }

        .bolt {
            font-size: 2.5rem;
            line-height: 1;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        h1 {
            margin: 0.85rem 0 0.5rem;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
        }

        p {
            margin: 0 0 0.65rem;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #9ca3af;
        }

        .hint {
            margin-top: 1.1rem;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: #6b7280;
        }

        button {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            background: #00f0ff;
            color: #0d0f12;
            border: none;
            border-radius: 0.35rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            background: #00ff66;
        }
    </style>
</head>

<body>
    <div class="panel">
        <div class="bolt">⚡</div>
        <h1>Connection lost</h1>
        <p>This device is offline and the mission shell is not cached yet.</p>
        <p>Reconnect once so 2Escape can store the app, then it will start offline.</p>
        <button type="button" onclick="window.location.reload()">Retry connection</button>
        <div class="hint">SEED STAYS THE SAME // NO PROGRESS LOST</div>
    </div>
</body>

</html>
